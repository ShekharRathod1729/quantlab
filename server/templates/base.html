<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuantLab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <header><a class="brand" href="/">QuantLab</a><nav><a href="/" {% if request.path == '/' %}class="active"{% endif %}>Stock simulation</a><a href="/options" {% if request.path == '/options' %}class="active"{% endif %}>Option pricing</a></nav></header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='shared.js') }}"></script>
</body>
</html>
